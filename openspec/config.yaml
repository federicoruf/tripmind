schema: spec-driven

context: |
  Language: all artifacts (proposal, design, specs, tasks) must be written in English, regardless of the language used in the conversation or in the user's request.
  The project overview is in `README.md` at the repository root.
  The project overview is in `README.md` at the repository root.
  Technical documentation lives in the `documentation/` folder.
  Before proposing a change, read `README.md` and only the documents in `documentation/` that apply to the task:
  - api-spec.yml: API endpoints, requests and responses
  - data.model.md: database schema and data model
  - backend-standards.md: backend code conventions
  - frontend-standards.md: frontend code conventions
  - testing-standards.md: how tests are written and run
  - deployment.md: environments, deployment and configuration
  - document-standards.md: how to write and update project documentation
  Do not copy the content of these documents into artifacts. Reference them by file name.

rules:
  specs:
    - Write all requirements and scenarios in English
  proposal:
    - Write in English
    - State clearly what is out of scope
    - List which documents in `documentation/` are affected by the change
  design:
    - Decisions must follow backend-standards.md and frontend-standards.md
    - If the change adds or modifies endpoints, describe the required update to api-spec.yml
    - If the change touches the database, describe the required update to data.model.md
  tasks:
    - Each task must name the file(s) to create or modify
    - Keep tasks small and ordered, so the project still works after each one
    - Include a task to write or update tests following testing-standards.md
    - Include a task to update the affected documents in `documentation/` following document-standards.md
  metadata:
    - "Always include the Jira ticket ID as the first line of proposal.md (e.g., `Jira: PROJ-123`)"

operations:
  apply:
    guidance:
      - Before each task, read the documents in `documentation/` that apply to it
      - Follow the conventions in the standards documents
      - Do not introduce new libraries if the project already solves the need
      - Run the tests described in testing-standards.md after each task
      - Update api-spec.yml and data.model.md when the code changes them
  archive:
    guidance:
      - Confirm that the affected documents in `documentation/` are up to date before archiving